<style>
/* Layout: one narrow app column, like a pocket vocabulary notebook; teal ink + yellow highlighter marker */
:root{
  --bg:#F3F6F8; --surface:#FFFFFF; --ink:#18242E; --muted:#5A6B78; --line:#DCE3E9;
  --accent:#0E7472; --accent-ink:#FFFFFF; --accent-soft:#D9EFEE;
  --marker:#FFD84D; --marker-ink:#2B2300;
  --good:#1E8E4E; --good-soft:#DDF3E5; --bad:#C93C3C; --bad-soft:#FBE3E3;
  --display:"Secular One","Assistant",system-ui,sans-serif;
  --body:"Assistant",system-ui,-apple-system,"Segoe UI",sans-serif;
  --en:"Lexend","Segoe UI",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1519; --surface:#182128; --ink:#E6EDF2; --muted:#93A4B2; --line:#2A3640;
  --accent:#3FC1BD; --accent-ink:#06201F; --accent-soft:#163533;
  --marker:#E9C540; --marker-ink:#1F1A00;
  --good:#4CC583; --good-soft:#15301F; --bad:#F07474; --bad-soft:#3A1C1C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1519; --surface:#182128; --ink:#E6EDF2; --muted:#93A4B2; --line:#2A3640;
  --accent:#3FC1BD; --accent-ink:#06201F; --accent-soft:#163533;
  --marker:#E9C540; --marker-ink:#1F1A00;
  --good:#4CC583; --good-soft:#15301F; --bad:#F07474; --bad-soft:#3A1C1C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:1.75rem} h2{font-size:1.35rem} h3{font-size:1.1rem}
p{margin:0}
.muted{color:var(--muted)}
.en{font-family:var(--en);direction:ltr;unicode-bidi:isolate}
button{font:inherit;cursor:pointer;border:0;border-radius:12px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--marker);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-ink);padding:12px 18px;font-weight:700;min-height:48px}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.btn.soft{background:var(--accent-soft);color:var(--ink)}
.btn.small{padding:6px 12px;min-height:36px;font-size:.95rem}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:baseline;gap:8px}
.logo mark{background:linear-gradient(transparent 55%,var(--marker) 55%);color:inherit;padding:0 2px}
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.tabs button{flex:1;background:transparent;color:var(--muted);padding:8px 10px;border-radius:999px;font-weight:700}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}

.num{font-variant-numeric:tabular-nums}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:start;color:var(--ink);display:flex;flex-direction:column;gap:4px;min-height:110px}
.mode:hover{border-color:var(--accent)}
.mode b{font-family:var(--display);font-weight:400;font-size:1.1rem}
.mode .step{font-size:.8rem;color:var(--muted);font-weight:700;letter-spacing:.02em}
.mode.rec{border:2px solid var(--marker)}
.words{display:flex;flex-direction:column}
.word-row{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}

.dots{display:flex;gap:3px;direction:ltr}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}

label{font-weight:700;font-size:.95rem}

textarea{min-height:140px;resize:vertical}
.field{display:flex;flex-direction:column;gap:6px}
.edit-row{display:grid;grid-template-columns:1fr 1fr 40px;gap:8px;align-items:center}
.edit-row.flag input{border-color:var(--marker)}
.icon-btn{width:40px;height:40px;background:transparent;color:var(--muted);font-size:1.2rem}
.note{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:.95rem}
.note.warn{background:var(--marker);color:var(--marker-ink)}

.q .prompt{font-size:2.2rem;font-weight:600;line-height:1.2;word-break:break-word}
.q .prompt.he{font-family:var(--display);font-weight:400}
.speak{width:72px;height:72px;border-radius:50%;background:var(--marker);color:var(--marker-ink);font-size:1.9rem;display:grid;place-items:center}
.choices{display:flex;flex-direction:column;gap:10px;width:100%}
.choice{background:var(--surface);border:2px solid var(--line);color:var(--ink);padding:14px;font-size:1.25rem;font-weight:700;min-height:58px}
.choice.right{border-color:var(--good);background:var(--good-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.spell-in{font-family:var(--en);font-size:1.6rem;text-align:center;direction:ltr;letter-spacing:.06em}

.letters .ok{color:var(--good);border-color:var(--good)}
.letters .no{color:var(--bad);border-color:var(--bad)}
.letters .miss{color:var(--muted);border-color:var(--bad)}

.progress .meter{flex:1}
.feedback{min-height:28px;font-weight:700}
.feedback.good{color:var(--good)} .feedback.bad{color:var(--bad)}
.result{text-align:center;align-items:center}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{background:var(--surface);border:1.5px solid var(--line);color:var(--ink);padding:8px 12px;font-weight:700}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}

.grade-grid{display:flex;flex-direction:column;gap:8px}
.grade-btn{background:var(--surface);border:2px solid var(--line);color:var(--ink);padding:12px 16px;font-family:var(--display);font-size:1.5rem;border-radius:var(--r);display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:start}

/* ---------- speech ---------- */
let voice = null, heVoice = null;
function pickVoice(){
  try {
    const vs = speechSynthesis.getVoices();
    heVoice = vs.find(v=>/^(he|iw)/i.test(v.lang)) || null;
    voice = vs.find(v=>/en[-_]US/i.test(v.lang) && /Samantha|Google|Aria|Jenny/i.test(v.name)) || vs.find(v=>/en[-_]US/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null;
  } catch(e) {}
}
try { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice } catch(e) {}
function say(text, slow){
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; if (voice) u.voice = voice;
    u.rate = slow ? 0.55 : 0.85;
    speechSynthesis.speak(u);
  } catch(e) {}
}

function speakSeq(parts){
  // parts: [[text, "he"|"en", rate?], ...] spoken one after another; resolves when done (or after a safety timeout)
  return new Promise(res=>{
    let done=false; const fin=()=>{ if(!done){ done=true; res(); } };
    try{
      speechSynthesis.cancel();
      parts.forEach(([t,lang,rate],i)=>{
        const u=new SpeechSynthesisUtterance(t);
        u.lang = lang==="he" ? "he-IL" : "en-US";
        const v = lang==="he" ? heVoice : voice; if(v) u.voice=v;
        u.rate = rate || (lang==="he" ? 1 : 0.8);
        if(i===parts.length-1){ u.onend=fin; u.onerror=fin; }
        speechSynthesis.speak(u);
      });
    }catch(e){ fin(); }
    setTimeout(fin, 900 + parts.reduce((a,[t])=>a+t.length*110,0));
  });
}

function daysTo(iso){
  if (!iso) return null;
  const t = new Date(iso+"T00:00:00"), n = new Date(); n.setHours(0,0,0,0);
  return Math.round((t-n)/864e5);
}
function dueLabel(iso){
  const d = daysTo(iso);
  if (d===null) return "";
  if (d<0) return "המבחן עבר";
  if (d===0) return "המבחן היום";
  if (d===1) return "המבחן מחר";
  return `המבחן בעוד ${d} ימים`;
}

function syncDraftInputs(){
  if(!draft) return;
  draft.words.forEach((w,i)=>{ const e=$("#en-"+i), h=$("#he-"+i); if(e) w.en=e.value.trim(); if(h) w.he=h.value.trim(); if(h && w.flag && h.value.trim()) {} });
  const n=$("#lname"), g=$("#lgrade"), d=$("#ldate"), t=$("#typed");
  if(n) draft.name=n.value; if(g) draft.grade=g.value; if(d) draft.testDate=d.value; if(t) draft.typed=t.value;
}

async function readPhoto(file){
  draft.err=""; draft.busy="קורא את הדף ומתרגם..."; render();
  try {
    const data = await sample.json(
      `This is a photo of a vocabulary list an Israeli English teacher gave to a pupil in grades 4–8. ` +
      `Extract every English vocabulary word or short phrase on the page, in order. Ignore titles, instructions, numbering and Hebrew text, ` +
      `except: if the page already shows a Hebrew translation next to a word, use it. Otherwise give the most likely Hebrew translation a child would learn at school ` +
      `(verbs in infinitive, e.g. "to borrow" → "לשאול (חפץ)"). If a word has two common school meanings, set "flag": true and put both in "note" in Hebrew. ` +
      `Reply with only a JSON array like [{"en":"journey","he":"מסע","flag":false,"note":""}].`,
      {images:[file], modelTier:"default"});
    if(!Array.isArray(data) || !data.length) throw {code:"invalid_json"};
    draft.words = data.filter(x=>x && x.en).map(x=>({en:String(x.en).trim(), he:String(x.he||"").trim(), flag:!!x.flag, note:String(x.note||"")}));
    if(!draft.name) draft.name = "רשימה מהמורה";
  } catch(e) { draft.err = errCopy(e && e.code); }
  draft.busy=false; render();
}

async function parseTyped(){
  const lines = draft.typed.split(/\n+/).map(s=>s.trim()).filter(Boolean);
  if(!lines.length){ draft.err="הקלידו לפחות מילה אחת."; return render(); }
  draft.err="";
  draft.words = lines.map(s=>{ const m=s.split(/\s*[-–—=:]\s*/); return {en:m[0].trim(), he:(m.slice(1).join(" ")||"").trim(), flag:false, note:""}; });
  const missing = draft.words.filter(w=>!w.he);
  if(missing.length && sample){
    draft.busy="מתרגם את המילים החסרות..."; render();
    try{
      const out = await sample.json(
        `Translate these English school vocabulary words to Hebrew for a pupil in grades 4–8 in Israel (verbs in infinitive). ` +
        `If a word has two common school meanings, set "flag": true and list both in "note" in Hebrew. ` +
        `Reply with only a JSON array, same order: [{"en":"...","he":"...","flag":false,"note":""}].\n\nWords:\n` + missing.map(w=>w.en).join("\n"),
        {modelTier:"quick"});
      if(Array.isArray(out)) missing.forEach((w,i)=>{ const o=out[i]; if(o){ w.he=String(o.he||""); w.flag=!!o.flag; w.note=String(o.note||""); } });
    }catch(e){ draft.err = errCopy(e && e.code) + " השלימו את התרגומים ידנית."; }
    draft.busy=false;
  }
  if(!draft.name) draft.name="רשימה חדשה";
  render();
}

function saveDraft(){
  syncDraftInputs();
  const words = draft.words.filter(w=>w.en);
  if(words.length<2){ draft.err="צריך לפחות 2 מילים כדי לתרגל."; return render(); }
  const noHe = words.filter(w=>!w.he).length;
  if(noHe){ draft.err=`חסר תרגום ל-${noHe} מילים. השלימו או הסירו אותן.`; return render(); }
  const l = {id:uid(), name:draft.name.trim()||"רשימה חדשה", grade:draft.grade, testDate:draft.testDate, words:words.map(w=>mkWord(w.en,w.he))};
  if(draft.groupNames && words.length===draft.origLen) l.groupNames = draft.groupNames;
  state.lists.push(l); save(); draft=null; go({name:"list", id:l.id});
}

/* ---------- session settings & groups ---------- */
const GSIZE = 10;
let MIX = {id:null, set:new Set()};
const readinessW = ws => ws.length ? Math.round(ws.reduce((a,w)=>a+w.box,0)/(MAXBOX*ws.length)*100) : 0;
function groupsOf(l){
  const n = Math.ceil(l.words.length/GSIZE);
  return Array.from({length:n},(_,i)=>({i, label:(l.groupNames&&l.groupNames[i])||`קבוצה ${i+1}`, words:l.words.slice(i*GSIZE,(i+1)*GSIZE)}));
}
function mixActive(l){ return MIX.id===l.id; }
function activePool(l){
  const gs = groupsOf(l);
  if(mixActive(l) && MIX.set.size>=2) return gs.filter(g=>MIX.set.has(g.i)).flatMap(g=>g.words);
  if(typeof l.sel==="number" && gs[l.sel]) return gs[l.sel].words;
  return l.words;
}
function sizeBar(withAll, label){
  const sizes=[5,10,15,20].concat(withAll?["all"]:[]);
  const cur = (!withAll && state.prefs.size==="all") ? 20 : state.prefs.size;
  return `<div class="setrow"><span class="muted">${label}</span><div class="seg">${sizes.map(z=>`<button data-psize="${z}" aria-pressed="${String(cur)===String(z)}">${z==="all"?"הכול":z}</button>`).join("")}</div></div>`;
}
function orderBar(){
  const o=[["weak","קודם החלשות"],["random","אקראי"],["seq","לפי הסדר"]];
  return `<div class="setrow"><span class="muted">סדר המילים</span><div class="seg">${o.map(([k,t])=>`<button data-porder="${k}" aria-pressed="${state.prefs.order===k}">${t}</button>`).join("")}</div></div>`;
}
function groupBar(l){
  const gs = groupsOf(l); if(gs.length<2) return "";
  const mix = mixActive(l);
  const chip=(key,label,pct,on)=>`<button data-grp="${key}" aria-pressed="${on}">${esc(label)}${pct===null?"":` <span class="muted num">${pct}%</span>`}</button>`;
  return `<div class="setrow"><span class="muted">${mix?"בחרו קבוצות לערבוב":"קבוצה"}</span><div class="seg ${gs.length>4?"small":""}">
    ${mix?"":chip("all",`כל המילים (${l.words.length})`,null,!(typeof l.sel==="number"))}
    ${gs.map(g=>chip(g.i,g.label,readinessW(g.words), mix?MIX.set.has(g.i):l.sel===g.i)).join("")}
  </div>
  <div class="row"><button class="btn small ${mix?"":"soft"}" data-act="mix">${mix?"ביטול הערבוב":"ערבוב חד פעמי בין קבוצות"}</button>
  ${mix?`<span class="muted" style="font-size:.9rem">${MIX.set.size<2?"בחרו לפחות 2 קבוצות.":`${MIX.set.size} קבוצות נבחרו. הערבוב יחול על הסשן הבא בלבד.`}</span>`:""}</div></div>`;
}

/* ---------- practice ---------- */
let P = null;
function pickWords(pool, n, order){
  if(order==="seq") return pool.slice(0,n);
  if(order==="random") return shuffle(pool).slice(0,n);
  // weakest first, with a little randomness among equals
  return shuffle(shuffle(pool).sort((a,b)=>a.box-b.box).slice(0,n));
}
function distractors(l, w, field){
  let pool = l.words.filter(x=>x.id!==w.id).map(x=>x[field]);
  if(pool.length<2){ pool = pool.concat(GRADES.flatMap(bankAll).map(([en,he])=>field==="en"?en:he).filter(x=>x!==w[field])); }
  return shuffle([...new Set(pool)]).slice(0,2);
}
function startPractice(mode){
  const l = state.lists.find(x=>x.id===view.id);
  const pool = activePool(l);
  const n = state.prefs.size==="all" ? pool.length : Math.min(+state.prefs.size||10, pool.length);
  const usedMix = mixActive(l) && MIX.set.size>=2;
  if(mixActive(l)) MIX = {id:null, set:new Set()};   // one-time mix
  const items = pickWords(pool, n, state.prefs.order).map(w=>{
    const it = {w, tries:0, done:false, ok:null, typed:""};
    if(mode==="learn") it.opts = shuffle([w.he, ...distractors(l,w,"he")]);
    if(mode==="reverse") it.opts = shuffle([w.en, ...distractors(l,w,"en")]);
    return it;
  });
  P = {mode, listId:l.id, items, i:0, score:0, locked:false, feedback:"", fbClass:"", mix:usedMix};
  go({name:"practice", id:l.id});
  setTimeout(autoSpeak, 250);
}
function autoSpeak(){ if(!P) return; const it=P.items[P.i]; if(it && (P.mode==="learn"||P.mode==="spell")) say(it.w.en); }
function grade(it, ok){
  const w = it.w;
  if(ok){ w.box=Math.min(MAXBOX,w.box+1); w.right++; P.score++; }
  else { w.box=Math.max(0,w.box-2); w.wrong++; }
  it.ok = ok; it.done = true;
  const L = state.lists.find(x=>x.id===P.listId); if(L) L.untouched = false;
  save();
}
const titles = {learn:"הכרה", reverse:"תרגום הפוך", spell:"איות בהכתבה", test:"מבחן"};

function practiceView(){
  const l = state.lists.find(x=>x.id===P.listId);
  if(P.i>=P.items.length) return resultView(l);
  const it = P.items[P.i], w = it.w;
  const pct = Math.round(P.i/P.items.length*100);
  let q="";
  if(P.mode==="learn"){
    q = `<button class="speak" data-act="say" aria-label="השמעה">🔊</button>
      <div class="prompt en">${esc(w.en)}</div>
      <button class="btn small soft" data-act="slow">השמעה איטית</button>
      <div class="choices">${it.opts.map((o,k)=>`<button class="choice ${it.done?(o===w.he?"right":(it.pick===k?"wrong":"")):""}" data-pick="${k}" ${it.done?"disabled":""}>${esc(o)}</button>`).join("")}</div>`;
  } else if(P.mode==="reverse"){
    q = `<p class="muted">איך אומרים באנגלית?</p><div class="prompt he">${esc(w.he)}</div>
      <div class="choices">${it.opts.map((o,k)=>`<button class="choice en ${it.done?(o===w.en?"right":(it.pick===k?"wrong":"")):""}" data-pick="${k}" ${it.done?"disabled":""}>${esc(o)}</button>`).join("")}</div>`;
  } else {
    const isSpell = P.mode==="spell";
    q = `${isSpell?`<button class="speak" data-act="say" aria-label="השמעה">🔊</button><div class="row"><button class="btn small soft" data-act="slow">השמעה איטית</button><span class="muted">רמז: ${esc(w.he)}</span></div>`:`<p class="muted">כתבו באנגלית</p><div class="prompt he">${esc(w.he)}</div>`}
      ${it.diff?`<div class="letters" aria-label="בדיקת אותיות">${it.diff}</div>`:""}
      <form id="spellform" style="width:100%;display:flex;flex-direction:column;gap:10px">
        <input id="spell" class="spell-in" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" value="${esc(it.typed)}" ${it.done?"disabled":""} aria-label="התשובה שלך">
        ${it.done?"":`<button class="btn" type="submit">בדיקה</button>`}
      </form>`;
  }
  return `<div class="row spread"><button class="back" data-act="quit">→ יציאה</button><span class="row" style="gap:6px">${P.mix?'<span class="pill marker">ערבוב</span>':""}<span class="pill">${titles[P.mode]}</span></span></div>
  <div class="progress"><span class="num muted">${P.i+1}/${P.items.length}</span><div class="meter"><i style="width:${pct}%"></i></div></div>
  <div class="card"><div class="q">${q}
    <div class="feedback ${P.fbClass}" aria-live="polite">${P.feedback}</div>
    ${it.done?`<button class="btn" data-act="next" id="nextbtn">${P.i+1<P.items.length?"הבא":"לסיכום"}</button>`:""}
  </div></div>`;
}

function letterDiff(typed, target){
  // align with edit distance so one missing letter doesn't turn the rest red
  const a = typed.toLowerCase(), b = target.toLowerCase(), n=a.length, m=b.length;
  const D = Array.from({length:n+1},(_,i)=>Array.from({length:m+1},(_,j)=>i===0?j:j===0?i:0));
  for(let i=1;i<=n;i++) for(let j=1;j<=m;j++) D[i][j]=Math.min(D[i-1][j]+1,D[i][j-1]+1,D[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  const ops=[]; let i=n, j=m;
  while(i>0||j>0){
    if(i>0&&j>0&&D[i][j]===D[i-1][j-1]+(a[i-1]===b[j-1]?0:1)){ ops.push(a[i-1]===b[j-1]?["ok",a[i-1]]:["no",a[i-1]]); i--; j--; }
    else if(j>0&&D[i][j]===D[i][j-1]+1){ ops.push(["miss","_"]); j--; }
    else { ops.push(["no",a[i-1]]); i--; }
  }
  return ops.reverse().map(([c,ch])=>`<span class="${c}">${esc(ch===" "?"·":ch)}</span>`).join("");
}

function checkSpell(){
  const it = P.items[P.i]; const v = $("#spell").value; it.typed = v;
  if(!v.trim()) return;
  const ok = norm(v)===norm(it.w.en);
  it.tries++;
  if(ok){ grade(it,true); it.diff=letterDiff(v,it.w.en); P.feedback="מצוין! נכון."; P.fbClass="good"; say(it.w.en); }
  else if(P.mode==="spell" && it.tries<2){ it.diff=letterDiff(v,it.w.en); P.feedback="כמעט. האותיות באדום לא במקום. נסו שוב."; P.fbClass="bad"; it.typed=""; }
  else { grade(it,false); it.diff=letterDiff(it.w.en,it.w.en); P.feedback=`התשובה הנכונה: ${esc(it.w.en)}`; P.fbClass="bad"; say(it.w.en); }
  render(); focusSpell();
}

const GMODS = [

const gi = () => Math.max(0, GRADES.indexOf(state.grade));

function tenseQ(){
  const g = gi();

  const v = pick(pool), sj = pick(SUBJ), t = pick(["past","present","future"]), mk = pick(MARK[t]);
  const ans = vform(v,t,sj.third), sent = `${mk} ${sj.low} ___ ${v.c}.`, full = sent.replace("___", ans);
  const why = t==="past" ? `"${E(mk)}" מסמן <b>עבר</b>. ${v.irr ? `${E(v.base)} הוא פועל יוצא דופן, ובעבר הוא ${E(v.past)}.` : `בעבר מוסיפים לפועל ${E("ed")}: ${E(v.past)}.`}`
    : t==="present" ? `"${E(mk)}" מסמן <b>הווה פשוט</b>. ${sj.third ? `עם he / she / it (וגם ${E(sj.low)}) מוסיפים s לפועל: ${E(v.s)}.` : `עם I / you / we / they הפועל נשאר בלי שינוי: ${E(v.base)}.`}`
    : `"${E(mk)}" מסמן <b>עתיד</b>: ${E("will")} + הפועל בלי שינוי: ${E("will "+v.base)}.`;
  if(g<=1 && Math.random()<0.35)
    return {key:"ti"+full, prompt:esc(full), instr:"באיזה זמן המשפט?", opts:["עבר","הווה","עתיד"], he:true, answer:TENSE_HE[t], explain:why, speak:full};
  const typed = typedFor();
  const cand = [vform(v,"past",sj.third), vform(v,"present",sj.third), vform(v,"future",sj.third), t==="present" ? (sj.third ? v.base : v.s) : null].filter(Boolean);
  const opts = shuffle([ans, ...shuffle([...new Set(cand)].filter(o=>o!==ans)).slice(0,3)]);
  return {key:"t"+full, prompt:B(esc(sent)) + (typed?` <span class="muted">(${esc(v.base)})</span>`:""), instr: typed?"כתבו את הפועל בזמן הנכון":"בחרו את צורת הפועל הנכונה", opts: typed?null:opts, answer:ans, alt: t==="future"?["'ll "+v.base]:[], explain:why, speak:full};
}
const RULE_G = {s:0, es:0, ies:1, ys:1, ves:2, irr:2, same:3};
const RULE_HE = {s:"ברוב המילים פשוט מוסיפים s", es:"מילים שנגמרות ב-s, x, sh, ch או o מקבלות es", ies:"עיצור + y בסוף: מחליפים את ה-y ב-ies", ys:"תנועה + y בסוף (ay, ey, oy): רק מוסיפים s", ves:"f או fe בסוף הופכים ל-ves", irr:"צורת רבים יוצאת דופן, לומדים אותה בעל פה", same:"המילה זהה ביחיד וברבים"};

  const n = pick(GRAM.nouns.filter(x=>RULE_G[x.r]<=gi())), typed = typedFor();
  const wrong = [...new Set([n.sg+"s", n.sg+"es", n.sg.replace(/y$/,"ies"), n.sg.replace(/fe?$/,"ves"), n.sg])].filter(w=>w!==n.pl);

function completeQ(){
  const g = gi(), pool = GRAM.complete[GRADES[g]].concat(g>0 ? GRAM.complete[GRADES[g-1]] : []);
  const [sent,a,d1,d2,he] = pick(pool), full = sent.replace("___", a);

function oppQ(){

const ART_HE = {v:"המילה מתחילה בצליל של תנועה (a, e, i, o, u), ולכן an", c:"המילה מתחילה בעיצור, ולכן a", h:"במילה hour ה-h לא נשמעת. המילה מתחילה בצליל תנועה, ולכן an", u:"המילה מתחילה בצליל 'יו', שהוא לא צליל של תנועה, ולכן a"};

    <button class="k-say" data-kact="say" aria-label="השמעת המילה שוב"><span class="emo">🔊</span></button>
    <div class="k-word">${esc(q.t.en)}</div>
    <div class="k-tiles n${n}">${tiles}</div>
    <div class="k-fb ${K.fbc}" aria-live="polite">${K.fb}</div>
  </div></div>`;
}
async function kidsTap(k){
  const q = K.qs[K.i]; if(q.done || K.busy || q.wrong.includes(k)) return;
  const o = q.opts[k], ks = kidsStore(), key = q.t.en+"|"+q.t.em;
  ks.seen[key] = ks.seen[key] || {r:0,w:0};
  if(o.en===q.t.en){
    q.done = true; ks.seen[key].r++; save();
    K.fb = q.first ? "כל הכבוד!" : "יופי, מצאת!"; K.fbc="good"; K.busy=true; render();
    await speakSeq([[q.first?"כל הכבוד!":"יופי!","he"],[q.t.en,"en"]]);
    K.busy=false; K.i++; K.fb=""; K.fbc=""; render(); setTimeout(kidsSayWord, 250);
  } else {
    q.wrong.push(k); q.first=false; ks.seen[key].w++; save();
    K.fb = `טעות. התמונה הזאת היא ${esc(o.he)}, באנגלית <span class="en">${esc(o.en)}</span>`; K.fbc="bad"; K.busy=true; render();
    await speakSeq([[`טעות, התמונה הזאת היא ${o.he}`,"he"],[o.en,"en"],["עוד פעם:","he"],[q.t.en,"en"]]);
    K.busy=false;
    // with one picture left it must be the answer; leave it for the child to tap
  }
}
function kidsDoneView(){
  const gold = K.qs.filter(q=>q.first).length, total = K.qs.length;
  const t = gold===total ? "מושלם!" : gold>=total/2 ? "כל הכבוד!" : "יפה מאוד!";
  return `<div class="card k-done">
    <div class="trophy emo" aria-hidden="true">${gold===total?"🏆":"🌟"}</div>
    <h2>${t}</h2>
    ${starsHTML()}
    <p class="num">${gold} כוכבים מלאים מתוך ${total}</p>
    <div class="row" style="justify-content:center"><button class="btn" data-kact="again">▶ עוד סיבוב</button><button class="btn soft" data-kact="start">נושא אחר</button></div>
  </div>`;
}

/* ---------- render + events ---------- */
function render(){
  const app = $("#app");
  if(!state.grade && !["grade","kids","kidsGame"].includes(view.name)) view = {name:"grade"};
  if(view.name==="gram") app.innerHTML = gramHubView();
  else if(view.name==="gramPlay") app.innerHTML = gramPlayView();
  else if(view.name==="kids") app.innerHTML = kidsStartView();
  else if(view.name==="kidsGame"){ app.innerHTML = kidsGameView(); if(K.i>=K.qs.length && !K.cheered){ K.cheered=true; speakSeq([["כל הכבוד! סיימת","he"]]); } }
  else if(view.name==="grade") app.innerHTML = gradeView();
  else if(view.name==="home") app.innerHTML = homeView();
  else if(view.name==="parent") app.innerHTML = parentView();
  else if(view.name==="list") app.innerHTML = listView() || "";
  else if(view.name==="add") app.innerHTML = addView();
  else if(view.name==="practice") app.innerHTML = practiceView();
  else if(view.name==="edit") app.innerHTML = addView();
  const ph = $("#photo"); if(ph) ph.onchange = e => { const f=e.target.files[0]; if(f) readPhoto(f); };
  const sf = $("#spellform"); if(sf) sf.onsubmit = e => { e.preventDefault(); checkSpell(); };
  const gf = $("#gform"); if(gf) gf.onsubmit = e => { e.preventDefault(); const v=$("#gin").value; if(!v.trim()) return; const q=G.qs[G.i]; G.typed=v; gramAnswer(norm(v)===norm(q.answer) || (q.alt||[]).some(a=>norm(a)===norm(v))); };
  if(view.name==="gramPlay" && G && !G.done){ const gi_=$("#gin"); if(gi_) gi_.focus(); }
}

document.addEventListener("click", e=>{
  const t = e.target.closest("button,[data-open]"); if(!t) return;
  const d = t.dataset;
  if(d.tab) return go({name:d.tab});
  if(d.open) return go({name:"list", id:d.open});
  if(d.mode) return startPractice(d.mode);
  if(d.src){ syncDraftInputs(); draft.src=d.src; draft.err=""; return render(); }
  if(d.bank){ draft.bankGrade=d.bank; return render(); }
  if(d.setgrade) return setGrade(d.setgrade);
  if(d.kage){ kidsStore().age=d.kage; save(); return render(); }
  if(d.kcat) return kidsStart(d.kcat);
  if(d.ktile!==undefined) return kidsTap(+d.ktile);
  if(d.kact==="start"){ try{speechSynthesis.cancel()}catch(_){} K=null; return go({name:"kids"}); }
  if(d.kact==="exit"){ try{speechSynthesis.cancel()}catch(_){} K=null; return go({name:"kids"}); }
  if(d.kact==="say") return kidsSayWord();
  if(d.kact==="again") return kidsStart(K.cat);
  if(d.psize){ state.prefs.size = d.psize==="all" ? "all" : +d.psize; save(); return render(); }
  if(d.porder){ state.prefs.order = d.porder; save(); return render(); }
  if(d.grp!==undefined){
    const l = state.lists.find(x=>x.id===view.id); if(!l) return;
    if(mixActive(l)){ const k=+d.grp; MIX.set.has(k)?MIX.set.delete(k):MIX.set.add(k); }
    else { l.sel = d.grp==="all" ? "all" : +d.grp; save(); }
    return render();
  }
  if(d.gmod) return startGram(d.gmod);
  if(d.gopt!==undefined && G && !G.done){ G.pick=+d.gopt; return gramAnswer(G.qs[G.i].opts[+d.gopt]===G.qs[G.i].answer); }
  if(d.act==="gram"){ G=null; return go({name:"gram"}); }
  if(d.act==="gagain") return startGram(G.id);
  if(d.act==="ghint"){ G.showHint=true; return render(); }
  if(d.act==="gsay") return say(G.qs[G.i].speak);
  if(d.act==="gnext"){ G.i++; G.done=false; G.ok=null; G.typed=""; G.showHint=false; G.pick=null; return render(); }
  if(d.act==="mix"){ const l=state.lists.find(x=>x.id===view.id); MIX = mixActive(l) ? {id:null,set:new Set()} : {id:l.id, set:new Set()}; return render(); }
  if(d.topic){
    const all = d.topic==="__all", topics = all ? Object.keys(BANK[draft.bankGrade]) : [d.topic];
    draft.words = topics.flatMap(t=>BANK[draft.bankGrade][t]).map(([en,he])=>({en,he,flag:false,note:""}));
    draft.groupNames = topics.flatMap(t=>{ const k=Math.ceil(BANK[draft.bankGrade][t].length/GSIZE); return Array.from({length:k},(_,i)=>k>1?`${t} ${i+1}`:t); });
    draft.origLen = draft.words.length;
    draft.name = all ? `כל המאגר – כיתה ${draft.bankGrade}` : d.topic; draft.grade=draft.bankGrade; draft.testDate=""; return render();
  }
  if(d.del!==undefined){ syncDraftInputs(); draft.words.splice(+d.del,1); return render(); }
  if(d.pick!==undefined && P){
    const it=P.items[P.i]; if(it.done) return;
    const val = it.opts[+d.pick], target = P.mode==="learn"?it.w.he:it.w.en;
    it.pick=+d.pick; const ok = val===target; grade(it, ok);
    P.feedback = ok ? "נכון!" : `לא בדיוק. התשובה: ${esc(target)}`; P.fbClass = ok?"good":"bad";
    if(P.mode==="reverse") say(it.w.en);
    render(); const n=$("#nextbtn"); if(n) n.focus(); return;
  }
  switch(d.act){
    case "home": draft=null; return go({name:"home"});
    case "add": newDraft(); return go({name:"add"});
    case "parse": syncDraftInputs(); return parseTyped();
    case "grade": return go({name:"grade"});
    case "addrow": syncDraftInputs(); draft.words.push({en:"",he:"",flag:false,note:""}); render(); const last=$("#en-"+(draft.words.length-1)); if(last) last.focus(); return;
    case "savelist": return view.name==="edit" ? saveEdit() : saveDraft();
    case "edit": { const l=state.lists.find(x=>x.id===view.id); draft={src:"type",name:l.name,grade:l.grade,testDate:l.testDate,words:l.words.map(w=>({en:w.en,he:w.he,flag:false,note:"",id:w.id})),typed:"",busy:false,err:"",bankGrade:"ו'",editId:l.id}; return go({name:"edit", id:l.id}); }
    case "delete-ask": $("#delbox").hidden=false; return;
    case "delete-cancel": $("#delbox").hidden=true; return;
    case "delete": state.lists=state.lists.filter(x=>x.id!==view.id); save(); return go({name:"home"});
    case "reset-ask": $("#resetbox").hidden=false; return;
    case "reset-cancel": $("#resetbox").hidden=true; return;
    case "reset": state={grade:null, lists:[]}; save(); return go({name:"home"});
    case "say": return say(P.items[P.i].w.en);
    case "slow": return say(P.items[P.i].w.en, true);
    case "next": P.i++; P.feedback=""; P.fbClass=""; render(); setTimeout(()=>{autoSpeak(); focusSpell();},150); return;
    case "again": return startPractice(P.mode);
    case "tolist": { const id=P.listId; P=null; return go({name:"list", id}); }
    case "quit": { const id=P.listId; P=null; try{speechSynthesis.cancel()}catch(_){} return go({name:"list", id}); }
  }
});

function saveEdit(){
  syncDraftInputs();
  const l = state.lists.find(x=>x.id===draft.editId);
  const words = draft.words.filter(w=>w.en);
  if(words.length<2){ draft.err="צריך לפחות 2 מילים כדי לתרגל."; return render(); }
  if(words.some(w=>!w.he)){ draft.err="חסר תרגום לחלק מהמילים."; return render(); }
  const old = Object.fromEntries(l.words.map(w=>[w.id,w]));
  l.words = words.map(w=>{ const o=w.id&&old[w.id]; if(o && o.en===w.en){ o.he=w.he; return o; } return mkWord(w.en,w.he); });
  if(l.words.length!==Object.keys(old).length) delete l.groupNames;
  l.sel = "all";
  l.name = draft.name.trim()||l.name; l.grade=draft.grade; l.testDate=draft.testDate; l.example=false;
  save(); const id=l.id; draft=null; go({name:"list", id});
}

render();
})();
</script>
